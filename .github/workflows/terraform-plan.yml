name: Terraform plan

on:
  pull_request:
    types: [opened]
    paths:
      - 'dev/**'
      - 'central/**'
      - 'stg/**'
      - 'prod/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: ap-southeast-1
  PLAN_BUCKET: ${{ vars.TERRAFORM_PLAN_BUCKET || 'platform-dev-terraform-state' }}
  PLAN_PREFIX: github-actions/terraform-plans

jobs:
  plan:
    name: Plan changed Terraform roots
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-terraform-plan

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Find Terraform roots
        id: roots
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t roots < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.tf' '*.tfvars' |
              while IFS= read -r file; do
                case "$file" in
                  dev/*|central/*|stg/*|prod/*) ;;
                  *) continue ;;
                esac
                directory=${file%/*}
                [[ "$directory" != "$file" ]] || directory=.
                while [[ "$directory" != . && ! -f "$directory/providers.tf" ]]; do
                  directory=${directory%/*}
                  [[ -n "$directory" ]] || directory=.
                done
                [[ -f "$directory/providers.tf" ]] && printf '%s\n' "$directory"
              done | sort -u
          )
          if ((${#roots[@]} == 0)); then
            echo "No Terraform roots changed."
            echo 'roots=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'Terraform roots:\n%s\n' "${roots[*]}"
          printf 'roots=%s\n' "$(printf '%s\n' "${roots[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

      - name: Plan and publish bundle
        if: steps.roots.outputs.roots != '[]'
        env:
          ROOTS_JSON: ${{ steps.roots.outputs.roots }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plan-bundle
          while IFS= read -r root; do
            safe_root=${root//\//__}
            terraform -chdir="$root" init -input=false
            terraform -chdir="$root" plan -input=false -out="$GITHUB_WORKSPACE/plan-bundle/${safe_root}.tfplan"
            terraform -chdir="$root" show -no-color "$GITHUB_WORKSPACE/plan-bundle/${safe_root}.tfplan" > "plan-bundle/${safe_root}.txt"
            printf '%s\n' "$root" >> plan-bundle/roots.txt
          done < <(jq -r '.[]' <<< "$ROOTS_JSON")
          tar -czf terraform-plans.tar.gz plan-bundle
          key="$PLAN_PREFIX/pr-${PR_NUMBER}/${HEAD_SHA}/terraform-plans.tar.gz"
          aws s3 cp terraform-plans.tar.gz "s3://${PLAN_BUCKET}/${key}"
          {
            echo "### Terraform plan"
            echo
            echo "Plan bundle: \`${key}\`"
            echo
            while IFS= read -r root; do
              safe_root=${root//\//__}
              echo "<details><summary>${root}</summary>"
              echo
              echo '```terraform'
              cat "plan-bundle/${safe_root}.txt"
              echo '```'
              echo '</details>'
              echo
            done < plan-bundle/roots.txt
          } > plan-comment.md

      - name: Comment plan on pull request
        if: steps.roots.outputs.roots != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file plan-comment.md

      - name: Comment when no Terraform root changed
        if: steps.roots.outputs.roots == '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body 'No Terraform root changed in this pull request.'
