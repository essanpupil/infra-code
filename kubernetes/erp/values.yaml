replicaCount: 2

image:
  repository: nginx
  tag: "1.27"
  # Set digest to deploy repository@sha256:... instead of a mutable tag.
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources: {}

containerPort: 80
livenessPath: /
readinessPath: /

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
